<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>댓글로 만들어가는 게임</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1b1f24;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ===== 세계 =====
  const WORLD = { w: 3000, h: 3000 };
  const TILE = 60;

  // ===== 캐릭터 =====
  const player = {
    x: WORLD.w / 2,
    y: WORLD.h / 2,
    r: 16,
    speed: 220,      // 초당 픽셀
    dirX: 0,
    dirY: 1,         // 바라보는 방향
    moving: false,
    walkTime: 0
  };

  // ===== 총 =====
  const gun = { cooldown: 0, rate: 0.18, bulletSpeed: 720, bulletLife: 0.75, recoil: 0 };
  const bullets = [];

  // ===== 몬스터 =====
  const MONSTER_COUNT = 14;
  const monsters = [];
  const poofs = [];
  function spawnMonster() {
    let x, y, tries = 0;
    do {
      x = 80 + Math.random() * (WORLD.w - 160);
      y = 80 + Math.random() * (WORLD.h - 160);
      tries++;
    } while (Math.hypot(x - player.x, y - player.y) < 500 && tries < 50);
    const a = Math.random() * Math.PI * 2;
    monsters.push({
      x, y, r: 18, hp: 3, maxHp: 3, speed: 50 + Math.random() * 30,
      vx: Math.cos(a), vy: Math.sin(a), turn: 1 + Math.random() * 2,
      hit: 0, t: Math.random() * 10
    });
  }
  for (let i = 0; i < MONSTER_COUNT; i++) spawnMonster();
  let respawnQueue = [];

  // ===== 카메라 =====
  const cam = { x: 0, y: 0 };

  // ===== 화면 크기 =====
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== 키보드 입력 =====
  const keys = {};
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Space: 'fire', KeyJ: 'fire'
  };
  // e.code가 비어 있는 환경을 위해 e.key로도 확인
  const KEYMAP_BY_KEY = {
    ArrowUp: 'up', Up: 'up', w: 'up', W: 'up', 'ㅈ': 'up',
    ArrowDown: 'down', Down: 'down', s: 'down', S: 'down', 'ㄴ': 'down',
    ArrowLeft: 'left', Left: 'left', a: 'left', A: 'left', 'ㅁ': 'left',
    ArrowRight: 'right', Right: 'right', d: 'right', D: 'right', 'ㅇ': 'right',
    ' ': 'fire', Spacebar: 'fire', j: 'fire', J: 'fire', 'ㅓ': 'fire'
  };
  const keyOf = e => KEYMAP[e.code] || KEYMAP_BY_KEY[e.key];
  document.addEventListener('keydown', e => {
    const k = keyOf(e);
    if (k) { keys[k] = true; e.preventDefault(); }
  }, true);
  document.addEventListener('keyup', e => {
    const k = keyOf(e);
    if (k) { keys[k] = false; e.preventDefault(); }
  }, true);
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // 키보드 포커스 확보 (미리보기 창 안에서 열려도 키 입력이 들어오도록)
  canvas.tabIndex = 0;
  canvas.style.outline = 'none';
  function grabFocus() {
    try { window.focus(); } catch (_) {}
    try { canvas.focus({ preventScroll: true }); } catch (_) {}
  }
  grabFocus();
  window.addEventListener('load', grabFocus);
  document.addEventListener('pointerdown', grabFocus, true);
  document.addEventListener('mouseenter', grabFocus);

  // ===== 터치 조이스틱 (화면 아무 곳이나 누르고 끌기) =====
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0, max: 50 };

  function stickStart(id, x, y) {
    stick.active = true;
    stick.id = id;
    stick.ox = x; stick.oy = y;
    stick.x = x; stick.y = y;
  }
  function stickMove(x, y) {
    stick.x = x; stick.y = y;
  }
  function stickEnd() {
    stick.active = false;
    stick.id = null;
  }

  // ===== 발사 버튼 (오른쪽 아래) =====
  const fireBtn = { r: 40, pressed: false, id: null };
  function fireBtnPos() {
    return { x: W - fireBtn.r - 28, y: H - fireBtn.r - 40 };
  }
  function onFireBtn(x, y) {
    const p = fireBtnPos();
    return Math.hypot(x - p.x, y - p.y) <= fireBtn.r + 14;
  }

  canvas.addEventListener('pointerdown', e => {
    if (!fireBtn.pressed && onFireBtn(e.clientX, e.clientY)) {
      canvas.setPointerCapture(e.pointerId);
      fireBtn.pressed = true;
      fireBtn.id = e.pointerId;
      e.preventDefault();
      return;
    }
    if (stick.active) return;
    canvas.setPointerCapture(e.pointerId);
    stickStart(e.pointerId, e.clientX, e.clientY);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (stick.active && e.pointerId === stick.id) {
      stickMove(e.clientX, e.clientY);
      e.preventDefault();
    }
  });
  const endHandler = e => {
    if (stick.active && e.pointerId === stick.id) stickEnd();
    if (fireBtn.pressed && e.pointerId === fireBtn.id) { fireBtn.pressed = false; fireBtn.id = null; }
  };
  canvas.addEventListener('pointerup', endHandler);
  canvas.addEventListener('pointercancel', endHandler);

  function getInput() {
    let ix = 0, iy = 0;
    if (keys.left) ix -= 1;
    if (keys.right) ix += 1;
    if (keys.up) iy -= 1;
    if (keys.down) iy += 1;

    if (stick.active) {
      let dx = stick.x - stick.ox;
      let dy = stick.y - stick.oy;
      const d = Math.hypot(dx, dy);
      if (d > 8) {
        const m = Math.min(d, stick.max) / stick.max;
        ix += (dx / d) * m;
        iy += (dy / d) * m;
      }
    }

    const len = Math.hypot(ix, iy);
    if (len > 1) { ix /= len; iy /= len; }
    return { x: ix, y: iy };
  }

  // ===== 업데이트 =====
  function update(dt) {
    const inp = getInput();
    const mag = Math.hypot(inp.x, inp.y);
    player.moving = mag > 0.05;

    if (player.moving) {
      player.x += inp.x * player.speed * dt;
      player.y += inp.y * player.speed * dt;
      player.dirX = inp.x / mag;
      player.dirY = inp.y / mag;
      player.walkTime += dt * (6 + 6 * mag);
    } else {
      player.walkTime = 0;
    }

    // 세계 경계
    player.x = Math.max(player.r, Math.min(WORLD.w - player.r, player.x));
    player.y = Math.max(player.r, Math.min(WORLD.h - player.r, player.y));

    // 총 쏘기
    gun.cooldown -= dt;
    gun.recoil = Math.max(0, gun.recoil - dt * 6);
    if ((keys.fire || fireBtn.pressed) && gun.cooldown <= 0) {
      gun.cooldown = gun.rate;
      gun.recoil = 1;
      const mx = player.x + player.dirX * (player.r + 14);
      const my = player.y + player.dirY * (player.r + 14);
      bullets.push({
        x: mx, y: my,
        vx: player.dirX * gun.bulletSpeed, vy: player.dirY * gun.bulletSpeed,
        life: gun.bulletLife
      });
    }

    // 총알 이동 + 몬스터 명중
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > WORLD.w || b.y > WORLD.h;
      if (!dead) {
        for (let j = monsters.length - 1; j >= 0; j--) {
          const m = monsters[j];
          if (Math.hypot(b.x - m.x, b.y - m.y) < m.r + 4) {
            m.hp--; m.hit = 0.12;
            m.x += b.vx / gun.bulletSpeed * 6; m.y += b.vy / gun.bulletSpeed * 6;
            dead = true;
            if (m.hp <= 0) {
              poofs.push({ x: m.x, y: m.y, t: 0 });
              monsters.splice(j, 1);
              respawnQueue.push(3);
            }
            break;
          }
        }
      }
      if (dead) bullets.splice(i, 1);
    }

    // 몬스터 돌아다니기
    for (const m of monsters) {
      m.t += dt;
      m.hit = Math.max(0, m.hit - dt);
      m.turn -= dt;
      if (m.turn <= 0) {
        const a = Math.random() * Math.PI * 2;
        m.vx = Math.cos(a); m.vy = Math.sin(a);
        m.turn = 1 + Math.random() * 2.5;
      }
      m.x += m.vx * m.speed * dt;
      m.y += m.vy * m.speed * dt;
      if (m.x < m.r || m.x > WORLD.w - m.r) { m.vx *= -1; m.x = Math.max(m.r, Math.min(WORLD.w - m.r, m.x)); }
      if (m.y < m.r || m.y > WORLD.h - m.r) { m.vy *= -1; m.y = Math.max(m.r, Math.min(WORLD.h - m.r, m.y)); }
    }

    // 쓰러진 몬스터는 잠시 뒤 다른 곳에 다시 나타남
    for (let i = respawnQueue.length - 1; i >= 0; i--) {
      respawnQueue[i] -= dt;
      if (respawnQueue[i] <= 0) { respawnQueue.splice(i, 1); spawnMonster(); }
    }

    // 쓰러짐 효과
    for (let i = poofs.length - 1; i >= 0; i--) {
      poofs[i].t += dt;
      if (poofs[i].t > 0.4) poofs.splice(i, 1);
    }

    // 카메라: 캐릭터를 화면 가운데에
    cam.x = player.x - W / 2;
    cam.y = player.y - H / 2;
  }

  // ===== 그리기 =====
  function drawWorld() {
    // 바깥(세계 밖)
    ctx.fillStyle = '#1b1f24';
    ctx.fillRect(0, 0, W, H);

    // 세계 바닥
    ctx.fillStyle = '#3f5a3c';
    ctx.fillRect(-cam.x, -cam.y, WORLD.w, WORLD.h);

    // 움직임이 보이도록 옅은 격자
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const startX = Math.max(0, Math.floor(cam.x / TILE) * TILE);
    const endX = Math.min(WORLD.w, cam.x + W + TILE);
    const startY = Math.max(0, Math.floor(cam.y / TILE) * TILE);
    const endY = Math.min(WORLD.h, cam.y + H + TILE);
    ctx.beginPath();
    for (let x = startX; x <= endX; x += TILE) {
      const sx = Math.round(x - cam.x) + 0.5;
      ctx.moveTo(sx, Math.max(0, -cam.y));
      ctx.lineTo(sx, Math.min(H, WORLD.h - cam.y));
    }
    for (let y = startY; y <= endY; y += TILE) {
      const sy = Math.round(y - cam.y) + 0.5;
      ctx.moveTo(Math.max(0, -cam.x), sy);
      ctx.lineTo(Math.min(W, WORLD.w - cam.x), sy);
    }
    ctx.stroke();

    // 세계 테두리
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 6;
    ctx.strokeRect(-cam.x, -cam.y, WORLD.w, WORLD.h);
  }

  function drawPlayer() {
    const sx = player.x - cam.x;
    const sy = player.y - cam.y;
    const bob = player.moving ? Math.abs(Math.sin(player.walkTime)) * 3 : 0;

    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + player.r * 0.7, player.r * 0.95, player.r * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    // 발 (걷는 모션)
    const step = player.moving ? Math.sin(player.walkTime) * 5 : 0;
    const px = -player.dirY, py = player.dirX; // 진행 방향의 수직
    ctx.fillStyle = '#2b2b3a';
    for (const side of [-1, 1]) {
      const fx = sx + px * side * 7 + player.dirX * step * side;
      const fy = sy + py * side * 7 + player.dirY * step * side + 4;
      ctx.beginPath();
      ctx.arc(fx, fy, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 몸
    const by = sy - bob;
    ctx.fillStyle = '#f2c14e';
    ctx.strokeStyle = '#7a5a12';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, by, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 총 (바라보는 방향으로 듦)
    {
      const back = gun.recoil * 3;
      const gx = sx + player.dirX * (player.r - 4 - back) + px * 6;
      const gy = by + player.dirY * (player.r - 4 - back) + py * 6;
      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate(Math.atan2(player.dirY, player.dirX));
      ctx.fillStyle = '#3a3d44';
      ctx.strokeStyle = '#15171b';
      ctx.lineWidth = 1.5;
      ctx.fillRect(-4, -3.5, 20, 7);
      ctx.strokeRect(-4, -3.5, 20, 7);
      ctx.fillRect(-2, 2, 5, 6);
      if (gun.recoil > 0.7) {
        ctx.fillStyle = '#ffd34d';
        ctx.beginPath();
        ctx.arc(19, 0, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 눈 (바라보는 방향)
    const ex = sx + player.dirX * 7;
    const ey = by + player.dirY * 7;
    ctx.fillStyle = '#222';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(ex + px * side * 5, ey + py * side * 5, 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawMonsters() {
    for (const m of monsters) {
      const sx = m.x - cam.x, sy = m.y - cam.y;
      if (sx < -40 || sy < -40 || sx > W + 40 || sy > H + 40) continue;
      const wob = Math.sin(m.t * 6) * 1.5;
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(sx, sy + m.r * 0.7, m.r, m.r * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = m.hit > 0 ? '#ffffff' : '#8e44ad';
      ctx.strokeStyle = '#4a1f5c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(sx, sy - wob, m.r + wob * 0.5, m.r - wob * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 눈
      const ex = sx + m.vx * 6, ey = sy - wob + m.vy * 6 - 3;
      ctx.fillStyle = '#fff';
      for (const side of [-1, 1]) {
        ctx.beginPath(); ctx.arc(ex + side * 6, ey, 4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#c0392b';
      for (const side of [-1, 1]) {
        ctx.beginPath(); ctx.arc(ex + side * 6 + m.vx * 1.5, ey + m.vy * 1.5, 2, 0, Math.PI * 2); ctx.fill();
      }

      // 체력바
      if (m.hp < m.maxHp) {
        const bw = 30;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(sx - bw / 2, sy - m.r - 14, bw, 5);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(sx - bw / 2, sy - m.r - 14, bw * (m.hp / m.maxHp), 5);
      }
    }
    for (const p of poofs) {
      const k = p.t / 0.4;
      ctx.strokeStyle = `rgba(200,160,230,${1 - k})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x - cam.x, p.y - cam.y, 10 + k * 26, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawBullets() {
    ctx.strokeStyle = '#ffe27a';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (const b of bullets) {
      const sx = b.x - cam.x, sy = b.y - cam.y;
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - b.vx * 0.015, sy - b.vy * 0.015);
    }
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  function drawFireBtn() {
    const p = fireBtnPos();
    ctx.fillStyle = fireBtn.pressed ? 'rgba(255,90,70,0.55)' : 'rgba(255,90,70,0.3)';
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, fireBtn.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 조준경 모양
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 13, 0, Math.PI * 2);
    ctx.moveTo(p.x - 20, p.y); ctx.lineTo(p.x - 6, p.y);
    ctx.moveTo(p.x + 6, p.y); ctx.lineTo(p.x + 20, p.y);
    ctx.moveTo(p.x, p.y - 20); ctx.lineTo(p.x, p.y - 6);
    ctx.moveTo(p.x, p.y + 6); ctx.lineTo(p.x, p.y + 20);
    ctx.stroke();
  }

  function drawStick() {
    if (!stick.active) return;
    let dx = stick.x - stick.ox;
    let dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy);
    if (d > stick.max) { dx = dx / d * stick.max; dy = dy / d * stick.max; }

    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(stick.ox, stick.oy, stick.max, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.arc(stick.ox + dx, stick.oy + dy, 22, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    drawWorld();
    drawMonsters();
    drawBullets();
    drawPlayer();
    drawStick();
    drawFireBtn();
  }

  // ===== 루프 =====
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
